name: Web NU Bungah CI/CD & Supabase Keep Alive

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 9 * * 1,4' # Otomatis berjalan Senin & Kamis jam 16:00 WIB
  workflow_dispatch: # Memunculkan tombol manual di UI GitHub Actions

jobs:
  # ====================================================================
  # JOB 1: Validasi Sistem & Build Aplikasi Web (Vite + Tailwind v4)
  # ====================================================================
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        # Bendera --legacy-peer-deps mengunci pemasangan modul native biner Tailwind v4 tanpa konflik di Ubuntu Runner
        run: npm ci --legacy-peer-deps

      - name: Build Project
        run: npm run build

  # ====================================================================
  # JOB 2: Otomatisasi Sinyal Supabase Agar Tidak Terkena Auto-Pause
  # ====================================================================
  supabase-keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API Directly
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e "
          if (!process.env.SUPABASE_URL || !process.env.SUPABASE_KEY) {
            console.log('⚠️ Peringatan: Kredensial Supabase tidak ditemukan di GitHub Secrets.');
            console.log('Langkah ping dilewati. Ini wajar jika dipicu dari push kode biasa sebelum Secrets diisi.');
            process.exit(0); 
          }

          async function ping() {
            console.log('Mengirim sinyal aktivitas ke REST API Supabase...');
            const response = await fetch(\`\${process.env.SUPABASE_URL}/rest/v1/\`, {
              method: 'GET',
              headers: {
                'apikey': process.env.SUPABASE_KEY,
                'Authorization': \`Bearer \${process.env.SUPABASE_KEY}\`
              }
            });

            if (response.ok) {
              console.log('✅ BERHASIL: Sinyal diterima. Proyek Supabase Anda tetap aktif!');
            } else {
              console.error('❌ GAGAL: Server merespons dengan status:', response.status);
              process.exit(1);
            }
          }

          ping().catch(err => {
            console.error('💥 EROR JARINGAN:', err.message);
            process.exit(1);
          });
          "
